# /etc/pi-maintenance.conf – Konfiguration der wöchentlichen Wartung
# Quelle: homelab/system/etc/pi-maintenance.conf (1:1-Kopie, CLAUDE.md §4.4)
# Bash-Syntax. Keine Secrets eintragen.

# --- Mail ---------------------------------------------------------------
MAIL_TO="<empfaenger@example.com>"     # TODO: Empfänger des Wartungsberichts
MAIL_FROM=""
# Befehl, der eine komplette Mail inkl. Header auf stdin annimmt.
# TODO: aus der alten Wartungsroutine übernehmen (msmtp/sendmail/...).
MAIL_COMMAND="/usr/sbin/sendmail -t"

# --- Protokoll ----------------------------------------------------------
LOG_DIR="/var/log/pi-maintenance"
LOG_KEEP_DAYS=90

# --- Gesundheitscheck ---------------------------------------------------
MIN_FREE_MB=2048
MIN_AVAIL_RAM_MB=300
MAX_TEMP_C=75

# --- Debian-Pakete ------------------------------------------------------
APT_LOCK_TIMEOUT=600

# --- Container-Updates (nur Meldung) ------------------------------------
CHECK_CONTAINER_UPDATES=1
# Compose-Dateien unterhalb dieses Pfads gelten als "Repo-Service"
REPO_SERVICES_DIR="/home/<benutzername>/homelab/services"   # TODO
# Für Container mit FESTEM Tag (z. B. :2026.11.1) den Tag angeben, dessen
# Version beobachtet werden soll. Schlüssel = Containername.
# Container mit gleitendem Tag (:latest, :stable) brauchen keinen Eintrag.
declare -A WATCH_TAGS=(
    # [homeassistant]="ghcr.io/home-assistant/home-assistant:stable"
    # [pihole]="pihole/pihole:latest"
)

# --- Healthchecks -------------------------------------------------------
# "Name|URL"
HTTP_CHECKS=(
    "Home Assistant|http://127.0.0.1:8123/"
)
# "Name|DNS-Server|Testname"   (benötigt dig: Paket dnsutils)
DNS_CHECKS=(
    "Pi-hole|127.0.0.1|debian.org"
)
